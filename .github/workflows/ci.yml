name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Client + host smoke tests
        run: npm test
      - name: React render probe
        run: node scripts/render-probe.mjs
      - name: Client bundle matches its checked-in sources
        run: |
          npm run build
          git diff --exit-code -- client/client.js
